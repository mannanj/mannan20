title = "mannan20 Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Documented non-secret env placeholders"
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
paths = ['''(^|/)(?:cloud-worker|visits-worker)/\.dev\.vars\.example$''']
regexes = ['''^(?:SESSION_SECRET|VISIT_SECRET|IP_SALT)=replace-with-[a-z0-9-]+$''']

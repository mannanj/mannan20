[project]
name = "mystudy-technical-exercise-api"
version = "0.1.0"
requires-python = "==3.11.15"
dependencies = [
    "fastapi==0.135.3",
    "pydantic==2.12.0",
    "uvicorn==0.43.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff==0.15.10",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

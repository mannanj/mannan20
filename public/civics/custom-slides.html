<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Civic Participation Under Survival Demands and Uncertain Influence</title>
  <style>
    :root {
      --paper: #f6f3ec;
      --ink: #111820;
      --muted: #56616b;
      --evidence: #006b74;
      --interpretation: #7445d4;
      --unknown: #8a5800;
      --vote: #c51f2a;
      --line: rgba(17, 24, 32, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); }
    body { color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .slide {
      width: 100vw;
      height: 100vh;
      display: none;
      position: relative;
      overflow: hidden;
      padding: clamp(42px, 7vh, 74px) clamp(46px, 7vw, 100px);
      background: var(--paper);
    }
    .slide.active { display: grid; grid-template-rows: auto 1fr auto; }
    .label { text-transform: uppercase; letter-spacing: 0.14em; font-size: 13px; font-weight: 800; color: var(--accent); }
    h1 { max-width: 17ch; margin: 18px 0 28px; font-size: clamp(40px, 6vw, 76px); line-height: 0.98; letter-spacing: -0.04em; }
    p, li { font-size: clamp(18px, 2vw, 27px); line-height: 1.35; }
    .statement { max-width: 36ch; font-size: clamp(26px, 3vw, 42px); line-height: 1.2; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-content: center; }
    .card { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 14px; padding: 20px 22px; background: rgba(255,255,255,0.55); }
    .card p { margin: 0; }
    .card-tag { margin-bottom: 8px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .source-note, .caveat, footer { color: var(--muted); font-size: 15px; }
    .question { max-width: 42ch; margin: 0 auto 26px; text-align: center; font-size: clamp(23px, 2.6vw, 37px); font-weight: 800; line-height: 1.22; }
    .counter-test { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
    .counter-test p { margin: 4px 0 0; font-size: clamp(15px, 1.45vw, 20px); }
    .research-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-content: center; }
    .research-panel h2 { margin: 0 0 10px; font-size: clamp(18px, 1.8vw, 25px); }
    .research-panel ol, .research-panel ul { margin: 0; padding-left: 1.2em; }
    .research-panel li { margin-bottom: 9px; font-size: clamp(15px, 1.35vw, 19px); line-height: 1.3; }
    .nav { position: fixed; right: 24px; bottom: 18px; z-index: 20; padding: 7px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 800; }
    [data-slide-id="evidence"] { --accent: var(--evidence); }
    [data-slide-id="interpretation"] { --accent: var(--interpretation); }
    [data-slide-id="limits"] { --accent: var(--unknown); }
    [data-slide-id="vote"] { --accent: var(--vote); }
    [data-slide-id="problem"], [data-slide-id="investigation"] { --accent: var(--ink); }
    @media print {
      @page { size: 13.333in 7.5in; margin: 0; }
      html, body { background: white; }
      .slide, .slide.active {
        display: grid;
        grid-template-rows: auto 1fr auto;
        width: 13.333in;
        height: 7.5in;
        break-after: page;
      }
      [data-slide-id="interpretation"] .question { margin-bottom: 18px; font-size: 30px; }
      [data-slide-id="interpretation"] .card { padding-block: 16px; }
      [data-slide-id="vote"] { padding-block: 22px; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <main id="deck" aria-live="polite"></main>
  <div class="nav" id="nav" role="status" aria-live="polite" aria-atomic="true"></div>
  <script id="deck-data" type="application/json">{"title":"Civic Participation Under Survival Demands and Uncertain Influence","statement":"People facing survival demands may find it unclear what matters to them or whether civic options, if any, fit their circumstances and can plausibly influence outcomes they care about.","caveat":"This synthesis draws on four source claims; it does not establish prevalence, causal relationships, who holds power, or whether suitable options exist.","slides":[{"id":"problem","label":"Problem statement for voting","title":"Civic Participation Under Survival Demands and Uncertain Influence","footer":"A provisional inquiry grounded in four source claims."},{"id":"evidence","label":"Source evidence","title":"Four uncertainties in one account","sourceNote":"Four claims from one source set. Original records and sampling context are unavailable.","excerpts":[{"sourceId":"s1","segments":["It is unclear what impact my actions will make"]},{"sourceId":"s2","segments":["It is unclear what I care about"]},{"sourceId":"s3","segments":["I am so busy focusing on basic survival tasks"]},{"sourceId":"s4","segments":["It is unclear what options are available","how long they will take","how they fit into my schedule"]}]},{"id":"interpretation","label":"Working paradox · interpretive hypothesis","title":"Clarity is required before commitment","workingParadox":"People are asked to commit scarce time before they can know whether participation fits their circumstances or can influence anything—but without that clarity, the commitment is difficult to justify.","dimensions":["Scarce time under survival demands","Unclear personal priorities","Unknown fit and effort","Uncertain influence"],"footer":"A tension to test—not a proven finding."},{"id":"limits","label":"What the evidence cannot establish","title":"The problem is still open","unknowns":["How common this situation is","Which uncertainties affect participation","Whether suitable civic options exist","Who controls access and influence"],"disconfirmingEvidence":"This framing weakens if people under comparable constraints can reliably judge fit and influence before committing, or if these uncertainties do not shape participation decisions."},{"id":"investigation","label":"A researchable problem","title":"Follow real participation decisions","questions":["How do people under survival demands decide whether to participate?","When do fit, effort, and possible influence become clear?","Which uncertainties, if any, shape nonparticipation?"],"evidenceToSeek":["Recent participation and nonparticipation accounts","Real requirements and decision or feedback pathways","Counterexamples where fit and influence were clear beforehand"],"voicesNeeded":["People who participated despite major constraints","People who declined, stopped, or were excluded","People who design participation or control decisions and feedback"]},{"id":"vote","label":"Vote to investigate","title":"Should this problem move forward?","prompt":"Vote for this statement if you want the next stage to investigate how people judge whether civic participation is possible and worthwhile under real-life constraints.","support":"A vote supports the inquiry. It does not endorse a solution or claim that the hypothesis is already proven."}]}</script>
  <script>
    const data = JSON.parse(document.getElementById('deck-data').textContent);
    const deck = document.getElementById('deck');
    const nav = document.getElementById('nav');
    const esc = value => String(value ?? '').replace(/[&<>"]/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
    })[char]);
    const list = values => `<div class="grid">${values.map(value =>
      `<div class="card"><p>${esc(value)}</p></div>`).join('')}</div>`;
    const excerpt = item => `<div class="card"><p>“${item.segments
      .map(esc).join('… ')}…”</p><div class="source-note">${esc(item.sourceId.toUpperCase())}</div></div>`;
    const slideBody = slide => {
      if (slide.id === 'problem') return `<p class="statement">${esc(data.statement)}</p>`;
      if (slide.id === 'evidence') {
        return `<div class="grid">${slide.excerpts.map(excerpt).join('')}</div>
          <p class="source-note">${esc(slide.sourceNote)}</p>`;
      }
      if (slide.id === 'interpretation') return `<p class="question">${esc(slide.workingParadox)}</p>${list(slide.dimensions)}`;
      if (slide.id === 'limits') {
        return `<div class="grid">${slide.unknowns.map(value =>
          `<div class="card"><div class="card-tag">Unknown</div><p>${esc(value)}</p></div>`
        ).join('')}</div><div class="counter-test"><div class="card-tag">What would change our mind</div><p>${esc(slide.disconfirmingEvidence)}</p></div><p class="caveat">${esc(data.caveat)}</p>`;
      }
      if (slide.id === 'investigation') return `<div class="research-grid"><div class="research-panel"><h2>Questions</h2><ol>${slide.questions.map(item => `<li>${esc(item)}</li>`).join('')}</ol></div><div class="research-panel"><h2>Evidence to seek</h2><ul>${slide.evidenceToSeek.map(item => `<li>${esc(item)}</li>`).join('')}</ul></div><div class="research-panel"><h2>Voices needed</h2><ul>${slide.voicesNeeded.map(item => `<li>${esc(item)}</li>`).join('')}</ul></div></div>`;
      return `<p class="statement">${esc(slide.prompt)}</p><p>${esc(slide.support)}</p>`;
    };
    data.slides.forEach((slide, index) => {
      const section = document.createElement('section');
      section.className = `slide${index === 0 ? ' active' : ''}`;
      section.dataset.slideId = slide.id;
      section.dataset.index = String(index);
      section.innerHTML = `<header><div class="label">${esc(slide.label)}</div><h1>${esc(slide.title)}</h1></header><div>${slideBody(slide)}</div><footer>${esc(slide.footer || '')}</footer>`;
      deck.appendChild(section);
    });
    const slides = [...document.querySelectorAll('.slide')];
    let current = 0;
    function show(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      slides.forEach((slide, position) => slide.classList.toggle('active', position === current));
      nav.textContent = `Slide ${current + 1} of ${slides.length}`;
    }
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === ' ') show(current + 1);
      if (event.key === 'ArrowLeft') show(current - 1);
    });
    show(0);
  </script>
</body>
</html>
